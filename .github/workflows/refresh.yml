name: Nightly data refresh

# Re-pulls the CURRENT season every night and commits the updated data file.
# The push makes Streamlit Community Cloud redeploy with the fresh numbers.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily (~6-7am US Eastern), after games finish
  workflow_dispatch: {}      # also adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write            # the job needs to commit the refreshed data back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install data dependencies
        run: pip install pybaseball pandas pyarrow

      - name: Refresh the current season
        run: python fetch_data.py $(date -u +%Y)

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "Nightly refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
